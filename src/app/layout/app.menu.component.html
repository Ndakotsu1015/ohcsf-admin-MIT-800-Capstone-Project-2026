<ul class="layout-menu d-flex flex-column mt-8">
    <ng-container  *ngFor="let item of model; let i = index;">
        <li class="navs" app-menuitem *ngIf="!item.separator" [item]="item" [index]="i" [root]="true"></li>
        <li  class="navs" *ngIf="item.separator" class="menu-separator"></li>
    </ng-container>
</ul>
